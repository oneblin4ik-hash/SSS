name = "serbolin-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Логи в панели Cloudflare. Без этого console.error из воркера уходит
# в никуда, и разбирать сбой будет нечем.
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "serbolin-bot"
database_id = "f841356f-59dc-4bea-9cd3-98bb82118b75"

[vars]
# Канал, на который проверяем подписку. Публичный, поэтому хватает
# юзернейма. Если канал когда-нибудь станет приватным — сюда пойдёт
# числовой id вида -1001234567890: у приватного канала юзернейма нет.
CHANNEL = "@Serbolin"

# Ссылка на кнопке «Подписаться на канал». Держим отдельно от CHANNEL:
# у приватного канала это будет инвайт-ссылка, а не адрес.
CHANNEL_URL = "https://t.me/Serbolin"

# Mini App с тестом. Cloudflare Pages, собирается из этой же ветки,
# папка quiz-test/dist.
QUIZ_URL = "https://serbolin-kviz.pages.dev/"


# День открытия продажи. Пока эта дата в будущем, бот НЕ ПРОДАЁТ: человек
# проходит тест, делает «День 0», получает карточку — но вместо цены видит
# дату и «напишу первым, как откроется». Догрев в это время не ставится,
# вместо шести касаний одно — в день открытия, всем накопившимся сразу.
#
# Пустое значение или кривая дата = бот продаёт как обычно. Так намеренно:
# забытая настройка не должна тихо выключить продажу навсегда.
#
# Время в UTC. Ставь на утро дня открытия по Москве, то есть 06:00 UTC.
LAUNCH_AT = "2026-10-12T06:00:00Z"

# Telegram id Эдуарда: сюда приходят заявки, по нему же пускают в /waiting.
# Секретом не является — его видит любой бот, которому человек написал.
# Держим прямо здесь намеренно: значения из [vars] переустанавливаются
# при каждой выкладке, а значит эта строка не потеряется никогда и руками
# её вписывать не надо.
ADMIN_ID = "708122486"

# BOT_TOKEN и WEBHOOK_SECRET сюда не пишем — вот это настоящие секреты.
# Кладутся в панели Cloudflare или командой `wrangler secret put`
# и в репозиторий не попадают.

# Крон: догрев и напоминания о висящих заявках. Раз в четверть часа —
# точнее не нужно, а чаще значит лишние запуски на ровном месте.
[triggers]
crons = ["*/15 * * * *"]
