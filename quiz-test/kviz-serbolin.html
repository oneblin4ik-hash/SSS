<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Тест: первые шаги к форме — Эдуард Серболин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ПАЛИТРА И ТИПОГРАФИКА — дизайн-система Crimson
   Void #0B0B0C · Plate #131315 · Accent #D8232A · Paper #FFFFFF
   Один алый акцент, не больше ~20% площади экрана. Второго
   акцентного цвета в системе нет — предупреждения тоже алые,
   отличаются насыщенностью, а не оттенком.

   Display — Manrope, а не Space Grotesk из хендоффа: у Space
   Grotesk нет кириллицы (Google Fonts отдаёт latin, latin-ext и
   vietnamese), весь текст здесь русский. В самом макете
   «Бумага, а не лендинг» абзац вручную переопределён на Manrope —
   то есть автор системы упёрся в это же и выбрал ту же замену.
   ============================================================ */
:root{
  --void:#0B0B0C;
  --plate:#131315;
  --plate-2:#1B1B1E;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.08);
  --line-3:rgba(255,255,255,.24);
  --accent:#D8232A;
  --accent-hi:#F4363D;
  --accent-deep:#9E1319;
  --accent-soft:rgba(216,35,42,.12);
  --text:#FFFFFF;
  --text-2:#E6E6E6;
  --text-3:#C8C8CE;
  --text-4:#9A9AA0;
  --text-5:#6B6B72;
  --text-off:#4E4E56;
  --r:16px;
  --r-lg:20px;
  --r-xl:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--void);color:var(--text-3)}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px;line-height:1.55;letter-spacing:-.1px;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
h1,h2,h3,.serif{font-family:'Manrope','Inter',sans-serif;font-weight:800;letter-spacing:-.04em;line-height:1.15;margin:0;color:var(--text)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}

/* ---------- прогресс ----------
   Четыре сегмента по фазам оставлены: они несут информацию,
   которой нет в одной сплошной полосе макета. Геометрия и цвет —
   по системе: 4px, трек rgba(255,255,255,.1), заливка акцентом. */
.top{position:sticky;top:0;z-index:20;background:var(--void);padding:14px 22px 12px}
.phases{display:flex;gap:6px}
.ph{flex:1}
.ph-bar{height:4px;border-radius:9999px;background:rgba(255,255,255,.1);overflow:hidden}
.ph-fill{height:100%;width:0;background:var(--accent);border-radius:9999px;transition:width .36s cubic-bezier(.4,0,.2,1)}
.ph-name{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-5);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ph.on .ph-name{color:var(--accent-hi)}
.step{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;
  font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-5)}
.step b{color:var(--accent-hi);font-weight:600}

/* ---------- экран ---------- */
.screen{flex:1;padding:20px 22px 132px}
.fade{animation:fade .26s cubic-bezier(.2,0,0,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:var(--accent-hi);margin-bottom:16px;font-weight:600}
h1{font-size:30px;line-height:1.15;letter-spacing:-1.2px;margin-bottom:12px}
h2{font-size:24px;line-height:1.18;letter-spacing:-.9px;margin-bottom:10px}
.sub{color:#8A8A90;font-size:14.5px;line-height:1.4;margin:0 0 26px}
p{margin:0 0 14px}

/* ---------- карточки-варианты ---------- */
.opts{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.opt{
  display:flex;align-items:center;gap:14px;
  background:var(--plate);border:1px solid var(--line-2);border-radius:var(--r);
  padding:17px 18px;font-size:16px;font-weight:600;line-height:1.3;color:var(--text-2);
  cursor:pointer;text-align:left;width:100%;font-family:inherit;
  transition:border-color .22s,background .22s,transform .12s;
}
.opt:hover{border-color:rgba(216,35,42,.6)}
.opt:active{transform:scale(.96)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.tick{width:20px;height:20px;flex:0 0 20px;border-radius:6px;border:1px solid var(--line-3);display:grid;place-items:center;color:#fff}
.opt[aria-pressed="true"] .tick{border-color:var(--accent);background:var(--accent)}
.tick svg{width:12px;height:12px;opacity:0;transition:opacity .16s}
.opt[aria-pressed="true"] .tick svg{opacity:1}
.opt.sq .tick{border-radius:6px}

/* ---------- микрофидбек тренера ---------- */
.fb{
  margin-top:18px;padding:15px 18px;background:var(--plate);
  border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;
  font-size:14.5px;line-height:1.5;color:var(--text-3);animation:fbin .3s cubic-bezier(.2,0,0,1) both;
}
@keyframes fbin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.fb .who{display:block;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent-hi);margin-bottom:6px;font-weight:600}

/* ---------- поля ---------- */
input[type=text]{
  width:100%;background:var(--plate);border:1px solid var(--line);border-radius:18px;
  padding:17px 18px;color:var(--text);font-size:16px;font-family:inherit;
  transition:border-color .22s;
}
input[type=text]::placeholder{color:var(--text-5)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.field{margin-bottom:24px}
.flabel{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:#8A8A90;margin-bottom:10px}
.fval{font-family:'JetBrains Mono',monospace;font-size:19px;color:var(--accent-hi);font-weight:700}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent;height:28px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(255,255,255,.1);border-radius:9999px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:none;margin-top:-8px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:4px;background:rgba(255,255,255,.1);border-radius:9999px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.duo{display:flex;gap:11px}
.duo .opt{justify-content:center}

/* ---------- фигуры ---------- */
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.fig{background:var(--plate);border:1px solid var(--line-2);border-radius:18px;padding:10px 4px 8px;cursor:pointer;transition:border-color .22s,background .22s}
.fig:hover{border-color:rgba(216,35,42,.6)}
.fig[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* Высота слота фигуры. Контурный силуэт читался и на 78 px, но
   объёмная фигура на такой высоте превращается в пятно. */
:root{--fig-h:104px}
.fig svg,.fig img{width:100%;height:var(--fig-h);display:block;object-fit:contain}
.fig .cap{font-size:10px;color:var(--text-5);text-align:center;margin-top:6px;font-weight:600}
.fig[aria-pressed="true"] .cap{color:var(--accent-hi)}

/* ---------- дашборд ---------- */
.ab{display:flex;align-items:center;gap:14px;background:var(--plate);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
.ab .col{flex:1;text-align:center}
.ab .k{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text-5);margin-bottom:6px;font-weight:600}
.ab .v{font-family:'Manrope',sans-serif;font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--text)}
.ab .v.gold{color:var(--accent-hi)}
.ab .arrow{color:var(--accent);font-size:20px}
.chart{background:var(--plate);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 14px 12px;margin-bottom:14px}
.chart svg{width:100%;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-5);margin-top:12px;padding:0 2px}
.legend i{display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px}
.tile{background:var(--plate);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 8px;text-align:center}
/* Цифры плиток — белые. Это данные, а не действие: на экране прогноза
   рядом стоит алая кнопка, и три алых числа отбирали бы у неё внимание,
   разгоняя акцент далеко за 20% площади. */
.tile .v{font-family:'Manrope',sans-serif;font-size:24px;font-weight:800;letter-spacing:-1px;color:var(--text)}
.tile .k{font-size:10px;color:var(--text-5);margin-top:5px;line-height:1.3}
/* Предупреждение. Отдельного «опасного» цвета в системе нет —
   отличаем заливкой и насыщенностью, а не вторым оттенком. */
.warn{background:rgba(216,35,42,.10);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:15px 18px;font-size:14.5px;line-height:1.5;margin-bottom:14px}
.warn b{color:var(--accent-hi)}
.note{font-size:13px;color:var(--text-5);line-height:1.45}

/* ---------- блоки диагностики ---------- */
.blk{background:var(--plate);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:12px}
.blk .h{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.7px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.blk .num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-hi);border:1px solid rgba(216,35,42,.45);border-radius:6px;padding:3px 7px;font-weight:700}
.blk p:last-child{margin-bottom:0}
.blk ul{margin:0 0 14px;padding-left:18px}
.blk li{margin-bottom:8px}
.blk li::marker{color:var(--accent)}
.type-seal{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.seal{width:56px;height:56px;flex:0 0 56px;border-radius:50%;border:1px solid rgba(216,35,42,.45);display:grid;place-items:center;font-size:22px;background:var(--accent-soft)}
.type-seal .tn{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.7px;color:var(--text)}
.type-seal .tl{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:var(--accent-hi);margin-top:5px;font-weight:600}

/* ---------- кнопки ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px 22px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--void) 62%,rgba(11,11,12,0));pointer-events:none}
.bottom-in{max-width:520px;margin:0 auto;pointer-events:auto}
.btn{
  width:100%;border:none;border-radius:9999px;padding:19px;font-family:inherit;
  font-size:13px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;
  background:var(--accent);color:#fff;cursor:pointer;
  box-shadow:0 10px 30px rgba(216,35,42,.3);
  transition:transform .12s,filter .22s,box-shadow .22s;
}
.btn:hover{background:var(--accent-hi)}
.btn:active{transform:scale(.96)}
.btn:disabled{background:rgba(255,255,255,.03);color:var(--text-off);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:#8A8A90;border:1px solid var(--line-2);margin-top:10px;
  font-weight:600;letter-spacing:1px;box-shadow:none}
.btn.ghost:hover{background:transparent;color:var(--text)}
.back{background:none;border:none;color:var(--text-5);font-family:inherit;font-size:13px;padding:6px 0;cursor:pointer}

/* Ряд «назад + дальше». Акцент в системе один и он у основной кнопки,
   поэтому возврат — тихий контурный круг, а не вторая алая пилюля. */
.btn-row{display:flex;gap:10px;align-items:stretch}
.btn-row .btn{flex:1}
.navback{flex:none;width:58px;border:1px solid var(--line-2);border-radius:9999px;
  background:transparent;color:var(--text-4);cursor:pointer;display:grid;place-items:center;
  transition:color .18s,border-color .18s,transform .12s}
.navback svg{width:19px;height:19px;display:block}
.navback:hover{color:var(--text);border-color:var(--line-3)}
.navback:active{transform:scale(.94)}
.navback:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- интро ---------- */
.hero-seal{width:76px;height:76px;margin:0 auto 22px;border-radius:50%;border:1px solid rgba(216,35,42,.45);display:grid;place-items:center;overflow:hidden;position:relative}
.hero-seal img{width:100%;height:100%;object-fit:cover;display:block}
.hero-seal::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(216,35,42,.18)}
.hero-seal span{font-family:'Manrope',sans-serif;font-weight:800;font-size:26px;color:var(--accent)}
.bullets{list-style:none;padding:0;margin:0 0 22px}
.bullets li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.45}
.bullets li:last-child{border:none}
.bullets .n{font-family:'Manrope',sans-serif;font-size:15px;color:var(--accent);padding-top:1px;font-weight:800;letter-spacing:-.6px}
.motto{font-family:'Manrope',sans-serif;font-size:15px;letter-spacing:-.5px;color:var(--accent-hi);text-align:center;margin:26px 0 0;font-weight:800}

/* ---------- печать фазы ---------- */
.stamp{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(11,11,12,.86);animation:fade .2s ease both;pointer-events:none}
.stamp-in{text-align:center;animation:stampin .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stampin{from{opacity:0;transform:scale(1.5) rotate(-9deg)}to{opacity:1;transform:none}}
.stamp .ring{width:104px;height:104px;margin:0 auto 16px;border:1px solid rgba(216,35,42,.45);background:var(--accent-soft);border-radius:50%;display:grid;place-items:center;font-size:38px}
.stamp .t1{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-5);font-weight:600}
.stamp .t2{font-family:'Manrope',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.9px;color:var(--text);margin-top:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="top" hidden>
    <div class="phases" id="phases"></div>
    <div class="step"><span id="stepTxt"></span><span id="timeTxt"></span></div>
  </div>
  <main class="screen" id="screen"></main>
  <div class="bottom"><div class="bottom-in" id="bottom"></div></div>
</div>

<script>
/* ==========================================================================

   Лид-магнит воронки Mr. Serbolin. Ведёт на трипваер «Первые шаги к форме».

   РАЗРАБОТЧИКУ:
   1. CFG.API — эндпоинт бэкенда бота. Если пусто, приложение отдаёт результат
      через Telegram.WebApp.sendData (работает только при запуске из
      reply-keyboard кнопки, лимит 4096 байт).
   2. CFG.FIGURES — сюда подставить сгенерированные 3D-фигуры (по 6 на пол).
      Пока рисуются векторные заглушки.

const FIG_CAPS_BY_SEX = {

/* ------------------------- расчёты ------------------------- */
function chartMode(){
  const d = Math.abs(S.wNow - S.wGoal);
  if (S.goal === 'tone') return d >= 4 ? 'weight' : 'form';
  return d >= 2 ? 'weight' : 'form';
}
/* Число тренировок теперь берётся из прямого ответа, а не выводится из
   образа жизни: человек сам сказал, сколько раз в неделю готов. */
const TR_BY_FREQ = { "1":1, "2":2, "3":3, "4+":4 };
function trainings(){ return TR_BY_FREQ[S.freq] || 2; }
/* Реже тренируешься — дольше идёшь. Коэффициент грубый, но показывать один
   и тот же срок при одной и при четырёх тренировках в неделю — обман. */
const PACE_BY_TR = { 1:1.3, 2:1, 3:0.9, 4:0.85 };
function plan(){
  const gain = S.wGoal > S.wNow;
  const dAll = +Math.abs(S.wNow - S.wGoal).toFixed(1);
  const tr = trainings();
  const pace = PACE_BY_TR[tr] || 1;
  const M = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const dateIn = (w)=>{ const dt=new Date(Date.now()+w*7*864e5); return dt.getDate()+" "+M[dt.getMonth()]; };

  if (chartMode() === 'form'){
    const gap = Math.max(1, Math.abs((S.formGoal??0) - (S.formNow??0)));
    const weeks = Math.max(6, Math.round(Math.min(30, Math.max(6, gap*7)) * pace));
    return { mode:'form', weeks, tr, gap, d:dAll, gain, stage:false, stages:1, target:S.wGoal, date:dateIn(weeks) };
  }
  // Прогноз даём только на первый этап: 10% массы тела.
  // Обещать "минус 35 кг за полгода" — врать, а на этом строится доверие ко всему курсу.
  /* Темп зависит от пола, и это не мелочь. При равном относительном дефиците
     мужчина теряет быстрее: больше сухой массы, больше суточный расход. На
     наборе разрыв ещё заметнее — почти двукратный. Без этой развилки женщина
     получала мужской срок, не укладывалась в него и решала, что метод не
     работает, — ровно то, от чего её отговаривает урок дня 7.
     Числа — верхняя граница спокойного темпа, а не рекорд.
     Меняешь тут — меняй и в lib/profile.py, иначе экран и PDF разъедутся. */
  const RATE = {
    m: { gain: 0.35, lossBig: 0.7,  loss: 0.55 },
    f: { gain: 0.2,  lossBig: 0.55, loss: 0.45 },
  };
  const r = RATE[S.gender] || RATE.f;
  const rate = gain ? r.gain : (dAll > 15 ? r.lossBig : r.loss);   // кг в неделю
  const cap = Math.max(4, Math.round(S.wNow * 0.1));
  const stage = !gain && dAll > cap && dAll > 12;
  const d = stage ? cap : dAll;
  const weeks = Math.max(4, Math.min(44, Math.round(d / rate * pace) || 6));
  return {
    mode:'weight', weeks, tr, d, gain, stage,
    stages: stage ? Math.ceil(dAll / cap) : 1,
    target: stage ? +(S.wNow - d).toFixed(1) : S.wGoal,
    dAll, date: dateIn(weeks)
  };
}

const $screen = document.getElementById('screen');

function progress(){
  const q = Q[i];
  if (q.phase < 0) { $top.hidden = true; return; }
  $top.hidden = false;
  const vis = visible();
  const total = vis.length;
  const idx = vis.findIndex(x=>x.id===q.id) + 1;
  document.getElementById('phases').innerHTML = PHASES.map((p,n)=>{
    let w = 0;
    if (n < q.phase) w = 100;
    else if (n === q.phase) {
      const inPhase = vis.filter(x=>x.phase===n);
      const pos = inPhase.findIndex(x=>x.id===q.id) + 1;
      w = Math.round(pos/inPhase.length*100);
    }
    return '<div class="ph '+(n===q.phase?'on':'')+'"><div class="ph-bar"><div class="ph-fill" style="width:'+w+'%"></div></div><div class="ph-name">'+p+'</div></div>';
  }).join('');
  document.getElementById('stepTxt').innerHTML = 'Шаг <b>'+idx+'</b> из '+total;
  const left = Math.max(1, Math.ceil((total-idx)*10/60));
  document.getElementById('timeTxt').textContent = idx>=total ? 'готово' : '~'+left+' мин';
}

/* график */
function chartSVG(){
  const W=320,H=150,pad=26, p=plan(), mode=p.mode, rw=markWeek();
  const n=p.weeks, x=(k)=>pad+(W-pad*2)*(k/n);
  let pts=[], flat=[];
  for(let k=0;k<=n;k++){
    const t=k/n, ease=1-Math.pow(1-t,1.7);
    let y;
    if(mode==='weight') y = pad + (H-pad*2)*(p.gain ? (1-ease) : ease);
    else y = pad + (H-pad*2)*(1-ease);
    pts.push([x(k), y]);
    flat.push([x(k), mode==='weight' ? (p.gain? H-pad : pad) : H-pad]);
  }
  const d = pts.map((q,k)=>(k?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const df = flat.map((q,k)=>(k?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  let mark='';
  if(rw && rw < n){
    const k=Math.min(n, rw), t=k/n, ease=1-Math.pow(1-t,1.7);
    const rx=x(k), ry = mode==='weight' ? pad+(H-pad*2)*(p.gain?(1-ease):ease) : pad+(H-pad*2)*(1-ease);
    mark='<line x1="'+rx+'" y1="'+(pad-8)+'" x2="'+rx+'" y2="'+(H-pad+6)+'" stroke="#F4363D" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>'+
         '<circle cx="'+rx+'" cy="'+ry+'" r="5.5" fill="#F4363D"/><circle cx="'+rx+'" cy="'+ry+'" r="10" fill="none" stroke="#F4363D" stroke-width="1" opacity=".5"/>'+
         '<text x="'+rx+'" y="'+(pad-13)+'" fill="#F4363D" font-size="9" font-family="Inter,sans-serif" text-anchor="middle">14 дней</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="прогноз">'+
    '<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="rgba(255,255,255,.12)"/>'+
    '<path d="'+df+'" fill="none" stroke="#4E4E56" stroke-width="1.6" stroke-dasharray="5 4"/>'+
    '<path d="'+d+'" fill="none" stroke="#D8232A" stroke-width="2.6" stroke-linecap="round" style="stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.1s ease .15s forwards"/>'+
    mark+
    '<text x="'+pad+'" y="'+(H-8)+'" fill="#6B6B72" font-size="9" font-family="Inter,sans-serif">сегодня</text>'+
    '<text x="'+(W-pad)+'" y="'+(H-8)+'" fill="#6B6B72" font-size="9" font-family="Inter,sans-serif" text-anchor="end">'+p.weeks+' нед.</text>'+
    '<style>@keyframes draw{to{stroke-dashoffset:0}}</style></svg>';
}

/* ------------------------- экраны ------------------------- */
function render(){
  const q = Q[i];
  progress();
  fb = null;
  $screen.className = 'screen fade';
  window.scrollTo(0,0);
  R[q.id]();
  if (tg) { try { i>0 ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){} }
}
function next(){
  do { i++; } while (i < Q.length && !shown(Q[i]));
  maybeStamp(); render();
}
function back(){
  let k = i;
  do { k--; } while (k > 0 && !shown(Q[k]));
  if (k >= 0) { i = k; lastPhase = Q[i].phase; render(); }
}
function maybeStamp(){
  const ph = Q[i].phase;
  if (ph !== lastPhase && ph > 0 && ph < 3 && lastPhase !== null) {
    const done = PHASES[ph-1], ico = ["","🎯","🔬"][ph] || "✓";
    const el = document.createElement('div');
    el.className = 'stamp';
    el.innerHTML = '<div class="stamp-in"><div class="ring">'+ico+'</div><div class="t1">блок пройден</div><div class="t2">'+done+'</div></div>';
    document.body.appendChild(el);
    hapticOk();
    setTimeout(()=>el.remove(), 900);
  }
  lastPhase = ph;
}

      '<p>Оценку формы по картинке считай грубым ориентиром. Это не измерение, привязываться к ней не надо.</p>'+
      (zone
        ? '<p><b>Про '+zone+'.</b> Помню, и в тренировку это войдёт отдельным движением, а в разбор — отдельным абзацем. Но обещать «курс под '+zone+'» я не буду: за 14 дней зону не переделать, а точечно жир не сгоняется. Меняется тело целиком, просто начинаем с того, что беспокоит.</p>'
        : '')+
      '<p><b>Что изменится первым:</b> '+f('талия, бёдра, руки','живот, плечи, руки')+'. Тело станет собраннее, уйдёт ощущение мягкости. Первые признаки — через 2-4 недели стабильного режима.</p>'+
    '</div>'+

    '<div class="blk"><div class="type-seal"><div class="seal">'+t.icon+'</div><div><div class="tn">'+t.name+'</div><div class="tl">'+t.sub+'</div></div></div>'+
      t.text().map(p=>'<p>'+p+'</p>').join('')+
      (GOAL_BLOCK[S.goal] ? GOAL_BLOCK[S.goal]().map(p=>'<p>'+p+'</p>').join('') : '')+
    '</div>'+

    '<div class="blk"><div class="h"><span class="num">02</span>Что делать и чего не делать</div>'+
      '<p><b>Тренировки:</b> '+tr+' '+(tr===1?'раз':'раза')+' в неделю по '+(MINS_TXT[S.mins]||'полчаса')+' — ровно столько, сколько ты '+f('назвала','назвал')+'. План строится под это время, а не под идеальное. '+
        (knee ? 'С коленями и голеностопом — программа в обход ударной нагрузки: никаких прыжков и бега на старте. ' : '')+
        (back ? 'Со спиной убираем осевую нагрузку и работаем над корпусом. ' : '')+
        (tr >= 4
          ? 'И сразу предупрежу: на старте четвёртая тренировка чаще отнимает результат, чем добавляет — восстановление ещё не настроено. Начнём с трёх и добавим, когда тело будет готово.'
          : 'Добавлять больше на старте не нужно: результат делает регулярность, а не объём.')+'</p>'+
      '<p><b>Питание:</b> регулярные приёмы, достаточно белка, контроль порций, больше цельных продуктов. Точные цифры индивидуальны: их считают под вес, активность и кухню.</p>'+
      (medic
        ? '<div class="warn"><b>Отдельно и без обтекаемых формулировок.</b> Ты '+f('отметила','отметил')+' '+(S.health.includes('heart')&&S.health.includes('diab')?'сердце и диабет':S.health.includes('heart')?'сердце или давление':'диабет')+'. Тренер здесь второй, а первый — врач: нужно разрешение на нагрузку и понимание, чего тебе нельзя. Это не отмена плана, а его порядок. Я работал с такими людьми и работаю, но начинаем с бумажки от доктора, а не с приседаний.</div>'
        : '')+
      '<p><b>Чего не делать:</b></p><ul>'+
        '<li>прыгать в жёсткий дефицит: вернёшь всё с добавкой</li>'+
        (knee ? '<li>терпеть боль в коленях «потому что надо»</li>' : '<li>терпеть боль в суставах «потому что надо»</li>')+
        '<li>копировать чужие программы из интернета: половина упражнений тебе не подходит</li>'+
        '<li>менять всё разом в первый день. Именно на этом чаще всего и заканчивается первая неделя</li>'+
      '</ul>'+
      '<p>Если не начать, вес постоит и поползёт вверх — так работает возраст, и это не пугалка. Я вижу это каждый месяц: из десяти человек, которые стартуют без системы, до результата доходит один. Остальные не слабые, им просто не на чем держаться.</p>'+
    '</div>';
  btn('Забрать «День 0»', ()=>{ haptic(); next(); });
};

R.handoff = () => {
  $screen.innerHTML =
    '<div class="eyebrow">Итог · день 0</div>'+
    '<h1>'+S.name+', диагностика у тебя на руках</h1>'+
    '<p>Отпускать тебя с текстом и надеждой я не буду. Дальше одно задание, бесплатное, минут на десять.</p>'+
    '<div class="blk"><div class="h">День 0. Твоя стартовая точка</div>'+
      '<p>Ни диеты. Ни тренировки. Ни весов.</p>'+
      '<p>Почти все планы начинаются одинаково: «с понедельника меняю всё». И заканчиваются к среде. Поэтому сегодня не меняем ничего — только смотрим, с чем работаем.</p>'+
      '<p>Четыре вопроса в чате, я соберу твою карточку: режим дня, два реальных окна под тренировку и то, как сейчас устроена еда. С этого и начинаются первые шаги.</p>'+
    '</div>'+
    '<p class="note">Нажми кнопку — тест закроется, и я напишу тебе в чат.</p>';
  const b = document.createElement('button');
  b.className='btn'; b.textContent='Открыть «День 0» в чате';
  b.onclick = async () => {
    b.disabled = true; b.textContent = 'Отправляю…';
    await submit();
    hapticOk();
    if (tg) { try { tg.disableClosingConfirmation(); } catch(e){} tg.close(); }
    else { b.textContent = 'Готово (вне Telegram)'; }
  };
  bottomRow(b);
};

/* ------------------------- отправка в бота ------------------------- */
function payload(){
  const p = plan();
  return {
    v:2, n:S.name, g:S.gender, a:S.age, h:S.height,
    w:S.wNow, wg:S.wGoal, gl:S.goal, zn:S.zone,
    fn:S.formNow, fg:S.formGoal,
    ex:S.exp, ls:S.last, dd:S.did, mn:S.mins, fq:S.freq, hl:S.health,
    t:typeOf(), wk:p.weeks, tr:p.tr, bmi:bmi(), cm:chartMode()
  };
}
async function submit(){
  const data = payload();
  try {
    if (CFG.API) {
      await fetch(CFG.API, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ initData: tg ? tg.initData : '', result: data })
      });
      return;
    }
    if (tg && tg.sendData) { tg.sendData(JSON.stringify(data)); return; }
    console.log('QUIZ RESULT', data);
  } catch(e){ console.error(e); }
}

/* ------------------------- старт ------------------------- */
if (tg) { try { tg.BackButton.onClick(back); } catch(e){} }
render();
</script>
</body>
</html>
